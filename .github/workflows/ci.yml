# Test and build on PRs and main. Release tagging stays in release.yml
# (push to main only) so a pull request cannot mint a version.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Build server
        run: npm run build:server

      - name: Private desk acceptance
        run: npm run test:mvp

      - name: Isolated endpoint integration
        run: npm run test:integration
